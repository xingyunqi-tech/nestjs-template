# Redis service configuration
# This file adds Redis support for caching and queue features
#
# Usage:
#   docker compose -f docker/docker-compose.base.yaml -f docker/docker-compose.redis.yaml -f docker/docker-compose.postgres.yaml up

services:
  redis:
    image: redis:7.4.12-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:3.8.0
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
    ports:
      - '${REDIS_INSIGHT_PORT:-5540}:5540'
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools

volumes:
  redis-data:
  redisinsight-data:
